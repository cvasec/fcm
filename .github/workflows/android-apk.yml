name: Android APK

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'server/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # 저장소 Secret GOOGLE_SERVICES_JSON 에 google-services.json 내용을 넣으면 FCM 이 포함된 APK 가 만들어진다.
      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret 이 없어 FCM 없이 빌드합니다."
          fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk fcm-tts.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fcm-tts-apk
          path: fcm-tts.apk

      # 폰 브라우저에서 바로 받을 수 있도록 고정 태그의 Release 에도 올린다.
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-${{ github.ref_name }}
        run: |
          TAG="${TAG//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" fcm-tts.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "FCM TTS APK (${GITHUB_REF_NAME})" \
            --notes "커밋 ${GITHUB_SHA::7} 에서 빌드한 APK"
